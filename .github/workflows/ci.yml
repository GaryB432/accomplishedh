name: CI

on:
  push:
  pull_request:

env:
  VERCEL_GIT_COMMIT_REF: TBD
  VERCEL_GIT_COMMIT_SHA: TBD
  VERCEL_GIT_COMMIT_MESSAGE: TBD

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Disabled automatic install so we can handle Dependabot logic
          run_install: false

      # Fix Dependabot lockfiles before running pnpm install
      - name: Fix Dependabot Metadata Mismatch
        if: startsWith(github.head_ref, 'dependabot/')
        run: pnpm clean --lockfile

      # Run a standard frozen install for normal PRs, but allow updates for Dependabot
      - name: Install Dependencies
        run: |
          if [ "${{ startsWith(github.head_ref, 'dependabot/') }}" = "true" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Check
        run: pnpm --recursive run check

      - name: CLI Smoke Test
        run: pnpm --filter=@accomplishedh/cli run e2e:smoke

      - name: Lint
        run: pnpm --recursive run lint

      - name: Build
        run: pnpm --recursive run build

      - name: Test
        run: pnpx playwright install --with-deps && pnpm --recursive run test
