name: CI

on:
  push:
  pull_request:

env:
  VERCEL_GIT_COMMIT_REF: TBD
  VERCEL_GIT_COMMIT_SHA: TBD
  VERCEL_GIT_COMMIT_MESSAGE: TBD

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Fix Dependabot Metadata Mismatch
        if: startsWith(github.head_ref, 'dependabot/')
        run: pnpm clean --lockfile

      - name: Install Dependencies
        run: |
          if [ "${{ startsWith(github.head_ref, 'dependabot/') }}" = "true" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      # Idiomatic Way: Cache Playwright browsers based on your lockfile and Playwright version
      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(pnpm @playwright/test --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Only downloads browsers if they aren't already restored from cache
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Check
        run: pnpm --recursive run check

      - name: CLI Smoke Test
        run: pnpm --filter=@accomplishedh/cli run e2e:smoke

      - name: Lint
        run: pnpm --recursive run lint

      - name: Build
        run: pnpm --recursive run build

      - name: Test
        run: pnpm --recursive run test
